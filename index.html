<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasseBooya</title>
<style>
body {background:#0a0a0a;color:white;font-family:Arial;text-align:center;margin:0}
.container {padding:20px;max-width:500px;margin:0 auto}
.parceria {margin-bottom:15px}
.parceria p {margin:0 0 8px 0;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px}
.parceria img {width:100px;border-radius:8px;background:#fff;padding:5px}
.social {display:flex;justify-content:center;gap:12px;margin:15px 0 25px 0}
.social a {display:flex;align-items:center;gap:6px;text-decoration:none;color:white;background:#1a1a1a;padding:8px 14px;border-radius:8px;font-size:14px;border:1px solid #333}
.social a:hover {background:#2a2a2a;border-color:#a020f0}
.social img {width:18px;height:18px}
h1 {color:#a020f0;margin-bottom:5px}
h2 {margin-top:5px;font-weight:normal}
h3 {color:#00ff88;font-size:28px}
button {background:#a020f0;border:none;padding:15px 30px;color:white;font-size:18px;border-radius:10px;cursor:pointer;width:90%;margin-top:15px}
button:hover {background:#8a1ad1}
input {display:block;margin:10px auto;padding:12px;width:85%;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:white;font-size:16px}
input::placeholder {color:#888}
.qr {margin-top:25px;background:#1a1a1a;padding:15px;border-radius:12px}
.qr img {border-radius:8px;background:white;padding:10px}
</style>
</head>
<body>
<div class="container">
<div class="parceria">
<p>Parceria Oficial</p>
<img src="slody.jpg" alt="SLODY">
</div>
<div class="social">
<a href="https://www.instagram.com/slodybr?igsh=ZHJ2bnlhazFiY2Q=" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">Instagram</a>
<a href="https://youtube.com/@slodybr?si=UlLfNIfcGJpF9Cut" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/174/174883.png" alt="YouTube">YouTube</a>
</div>
<h1>PASSEBOOYA</h1>
<h2>Compre seu Passe Booyah</h2>
<h3>R$ 7,00</h3>
<form id="formCompra">
<input type="text" id="nome" placeholder="Nome completo" required>
<input type="text" id="cpf" placeholder="CPF" required>
<input type="email" id="email" placeholder="Email" required>
<input type="tel" id="telefone" placeholder="Telefone com DDD" required>
<input type="text" id="idff" placeholder="ID do Free Fire" required>
</form>
<div class="qr">
<h3>Pagamento via Pix</h3>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=00020126440014br.gov.bcb.pix0122ktxgabriel13@gmail.com52040000530398654047.005802BR5925GABRIEL DOS SANTOS GONCAL6009SAO PAULO62070503***6304083F" alt="QR Code Pix">
<p>1. Escaneie o QR Code<br>2. Pague R$ 7,00<br>3. Clique em "COMPRAR AGORA"</p>
</div>
<button onclick="comprar()">COMPRAR AGORA</button>
</div>
<script>
function comprar(){
let numero="5577981047147";
let nome=document.getElementById('nome').value;
let cpf=document.getElementById('cpf').value;
let email=document.getElementById('email').value;
let telefone=document.getElementById('telefone').value;
let idff=document.getElementById('idff').value;
if(!nome||!cpf||!email||!telefone||!idff){alert('Preencha todos os campos.');return;}
let msg=`Olá! Quero comprar o Passe Booyah R$ 7,00.%0A%0A*Dados:*%0ANome: ${nome}%0ACPF: ${cpf}%0AEmail: ${email}%0ATelefone: ${telefone}%0AID FF: ${idff}%0A%0AJá realizei o pagamento via Pix.`;
window.open("https://wa.me/"+numero+"?text="+msg,'_blank');
}
</script>
</body>
</html>
